[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entry-vla"
version = "0.1.0"
description = "Entry-state prediction for handing off from a geometric planner to a frozen local VLA policy (simulation-first)."
requires-python = ">=3.8"
# Core (geometry, episode format, annotation, metrics) is numpy/pyyaml/scipy only so it
# can run inside either simulator environment. Heavy stacks are optional extras.
# scipy: geometry.rotations uses scipy.spatial.transform (APIs available in 1.10, the last py3.8 release).
dependencies = ["numpy>=1.21", "pyyaml>=5.4", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=6"]
train = ["torch>=2.1"]
io = ["pyarrow>=12", "pillow>=9"]
viz = ["matplotlib>=3.5", "pillow>=9"]
perception = ["open3d>=0.18", "opencv-python-headless>=4.8", "pillow>=9"]   # Qwen3-VL/SAM need transformers+torch (train env)

[project.scripts]
entry-vla = "entry_vla.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sim: opt-in simulator integration test (requires installed backend + assets; run with --run-sim)",
  "torch: requires torch",
]
